name: guitar_zero
description: "Guitar Zero - afinador para guitarra e violão de 6 cordas."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Só as imagens base; o Flutter inclui as variantes 2.0x/ e 3.0x/.
  assets:
    - assets/instruments/acoustic_headstock.webp
    - assets/instruments/electric_headstock.webp
