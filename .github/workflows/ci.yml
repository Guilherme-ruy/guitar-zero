name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Manter alinhado com a versão documentada no README.
  FLUTTER_VERSION: 3.47.5

jobs:
  validate:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Versão
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Ferramentas de publicação
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Análise estática
        run: flutter analyze --fatal-infos

      - name: Testes
        run: flutter test

  android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependências
        run: flutter pub get

      # Release (AOT) assinado com a chave de debug do template: instalável
      # para testes em aparelho; não é um build de publicação.
      - name: Build APK release
        run: flutter build apk --release

      - name: Verificar permissões do APK (sem INTERNET)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::O APK de release não pode declarar INTERNET"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: guitar-zero-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
